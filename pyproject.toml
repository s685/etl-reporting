[tool.poetry]
name = "bluemoon-data-platform"
version = "0.1.0"
description = "Data platform pipelines and Snowflake DMF/data quality"
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.12"
snowflake-snowpark-python = ">=1.11.0"
openpyxl = ">=3.1.0"
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
PyYAML = ">=6.0.0"
pandas = ">=2.0.0"
cryptography = ">=41.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
mypy = ">=1.8.0"
isort = ">=5.13.0"
autoflake = ">=2.2.0"
pyupgrade = ">=3.15.0"
pre-commit = ">=3.6.0"
types-PyYAML = ">=6.0.0"
pandas-stubs = ">=2.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini.options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --strict-markers --cov=. --cov-report=html --cov-report=term-missing"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
