# ********************************************************************************
# YAML Configuration for yaml_multi_worksheet_template.py
# PURPOSE: Generate an Excel workbook with multiple worksheets from a SINGLE
#          Snowflake table. Each unique value in `grouping_column` becomes
#          a separate worksheet, with the grouping value as the sheet name.
# ********************************************************************************
# USAGE:
#   python yaml_multi_worksheet_template.py <this_file>.yml <database> <schema> \
#       <output_path> <output_file> <carrier_name> \
#       --warehouse <warehouse> --report_start_dt "2023-01-01" --report_end_dt "2023-12-31"
# ********************************************************************************

# ---- Required Keys ----
carrier_name: "{carrier_name}"
report_name: "Application Activity Report - Period"

# Single source table (fully qualified: DATABASE.SCHEMA.TABLE)
table: "DATABASE.SCHEMA.APPLICATION_ACTIVITY_TABLE"

# Column whose unique values determine the worksheets
grouping_column: "APPLICATION_TYPE"

# Session variable setup (supports {carrier_name}, {as_of_run_dt},
# {report_start_dt}, {report_end_dt}, {report_run_dt} interpolation)
pre_sql_query: |
  SET carrier_name = '{carrier_name}';
  SET report_start_dt = '{report_start_dt}';
  SET report_end_dt = '{report_end_dt}';

# ---- Header / Footer ----
header: true
footer: false

# ---- Data Options ----
# Columns to exclude from output (apart from grouping_column which is always excluded)
exclude_columns: []

# SQL WHERE clause filter applied before grouping (null = no filter)
filter_rows: null

# Columns to sort data within each worksheet
sorting_columns: []

# Columns that need dollar ($#,##0.00) formatting
dollar_columns: []

# Name for the worksheet containing rows where grouping_column IS NULL
null_group_sheet_name: "Unassigned"

# ---- Column Width ----
max_column_width: 20

# Override widths for specific columns (by Excel column letter)
# Example:
#   specific_column_widths:
#     - column: "A"
#       width: 30
#     - column: "B"
#       width: 15
specific_column_widths: []

# ---- Font Configuration ----
# sheet_header_font: applied to the 3-row report header (carrier, report name, dates)
sheet_header_font:
  name: Calibri
  size: 11
  bold: true
  color: "000000"
  alignment: left
  wrap_text: false
  fill_color: "FFFFFF"
  fill_type: solid

# table_header_font: applied to column header row
table_header_font:
  name: Calibri
  size: 11
  bold: true
  color: "FFFFFF"
  alignment: center
  wrap_text: true
  fill_color: "4472C4"
  fill_type: solid

# table_data_font: applied to data rows
table_data_font:
  name: Calibri
  size: 10
  bold: false
  color: "000000"
  alignment: left
  wrap_text: false
  fill_color: "FFFFFF"
  fill_type: none

# ---- Border Configuration ----
# border_to_row: thin border + fill applied to table header row
# Set to null to disable borders
border_to_row:
  border_to_table_headers: true
  start_color: "000000"
  end_color: "000000"
  fill_type: solid
